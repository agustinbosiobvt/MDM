<script>
function dataTable(items,columns,cell,rowClick,sort){
  const wrap=el('div','table-wrap'),table=el('table'),thead=el('thead'),head=el('tr');
  columns.forEach(([key,label])=>{const th=el('th');if(sort&&label&&!key.startsWith('_')&&!key.startsWith('p')&&key!=='line_status'){const b=el('button','',label+' ↕');b.type='button';b.onclick=()=>sort(key);th.append(b);}else th.textContent=label;head.append(th);});thead.append(head);table.append(thead);const tbody=el('tbody');
  if(!items.length){const row=el('tr'),td=el('td','empty','No hay registros para esta selección.');td.colSpan=columns.length;row.append(td);tbody.append(row);}
  items.forEach(r=>{const tr=el('tr',rowClick?'clickable':'');if(rowClick){tr.tabIndex=0;tr.onclick=()=>safe(()=>rowClick(r));tr.onkeydown=e=>{if(e.key==='Enter')safe(()=>rowClick(r));};}columns.forEach(([key])=>{const td=el('td'),value=cell(r,key);if(value instanceof Node)td.append(value);else td.textContent=value==null?'':String(value);tr.append(td);});tbody.append(tr);});table.append(tbody);wrap.append(table);return wrap;
}
function pager(result,onPage){const wrap=el('div','pagination'),pages=Math.max(1,Math.ceil(result.total/result.pageSize));wrap.append(el('span','',result.total+' registros · Página '+result.page+' de '+pages));const actions=el('div','actions'),prev=btn('← Anterior',()=>onPage(result.page-1),'small'),next=btn('Siguiente →',()=>onPage(result.page+1),'small');prev.disabled=result.page<=1;next.disabled=result.page>=pages;actions.append(prev,next);wrap.append(actions);return wrap;}
async function renderList(){
  const result=await rpc('list',Object.assign({type:S.type},S.list)),main=$('main');S.record=null;main.replaceChildren(heading('DATOS MAESTROS',LABELS[S.type],S.type==='company'?'Identidad legal y datos de tus empresas.':S.type==='customer'?'Relaciones comerciales, condiciones y listas de venta.':'Fabricantes, condiciones y listas de compra.',btn('+ '+(S.type==='company'?'Nueva empresa':S.type==='customer'?'Nuevo cliente':'Nuevo proveedor'),()=>recordForm(),'primary')));
  const panel=el('section','panel'),bar=el('div','toolbar'),search=el('input','search');search.type='search';search.placeholder='Buscar por código o nombre…';search.value=S.list.q;search.setAttribute('aria-label','Buscar registros');let timer;search.oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{S.list.q=search.value;S.list.page=1;safe(renderList);},400);};const select=el('select');[['active','Activos'],['removed','Retirados']].forEach(([value,label])=>{const o=el('option','',label);o.value=value;select.append(o);});select.value=S.list.show;select.setAttribute('aria-label','Estado del registro');select.onchange=()=>{S.list.show=select.value;S.list.page=1;safe(renderList);};bar.append(search,select);panel.append(bar);
  const columns=[['code','Código'],['legal_name','Razón social'],['trade_name','Nombre comercial'],['country_code','País']];if(S.type!=='company')columns.push(['status','Estado'],['default_currency','Moneda']);else columns.push(['is_default','Predeterminada']);columns.push(['_open','']);
  panel.append(dataTable(result.items,columns,(r,key)=>{if(key==='code')return el('span','code',r.code);if(key==='status')return badge(r.status);if(key==='is_default')return r.is_default===true||String(r.is_default).toUpperCase()==='TRUE'?'Sí':'—';if(key==='_open')return '→';return r[key]||'—';},r=>loadDetail(r.id),key=>{S.list.sort=key;S.list.order=S.list.order==='asc'?'desc':'asc';safe(renderList);}));panel.append(pager(result,page=>{S.list.page=page;safe(renderList);}));main.append(panel);
}
</script>
