[project]
name = "bvt-mdm-api"
version = "0.1.0"
description = "BVT Master Data Management API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "authlib>=1.9.1",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "DTZ", "PT"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app", "alembic_helpers"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["authlib.*", "slowapi.*", "openpyxl.*", "pycountry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pycountry>=26.2.16",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
