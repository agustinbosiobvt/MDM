# Serves the SPA and proxies /api + /auth to the API: one origin for the browser.

# Access log without query strings ($uri, not $request): /auth/callback carries Google's
# one-time authorization code and the login state, which must never reach a log. No
# Referer either, and never cookies.
log_format mdm_safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log mdm_safe;
    root /usr/share/nginx/html;

    client_max_body_size 21m;   # imports are capped at 20 MB by the API

    # No inline scripts or styles; everything comes from this origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Enable when served over HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Resolve "api" through Docker's DNS at request time (10 s cache). A static
    # proxy_pass would pin the IP from nginx startup and break when the API
    # container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location ~ ^/(api|auth)/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: nginx is the edge, and the API takes the first entry as
        # the client IP (rate limits, audit log). A client-sent X-Forwarded-For is dropped.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # The headers above are set here; drop the API's copies to avoid duplicates.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Permissions-Policy;

        # nginx error lines quote the full request (with ?code=...): only critical ones here.
        location ~ ^/auth/callback$ {
            error_log /dev/stderr crit;
            proxy_pass $api_upstream;
        }
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header in a location replaces the server-level ones, so repeat them.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        # Revalidate the app entry point after deployments; hashed assets remain immutable.
        expires -1;
        try_files $uri /index.html;
    }
}
